# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# SONIQ product configuration.
# The application ID is configurable; override per build with
#   ./gradlew assembleRelease -Psoniq.applicationId=com.example.custom
# The Kotlin namespace/package stays com.soniq.player regardless.
soniq.applicationId=com.soniq.player
soniq.versionCode=1
soniq.versionName=0.1.0
